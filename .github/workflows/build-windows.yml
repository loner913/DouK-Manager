name: 构建 Windows 便携版

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "resources/**"
      - "tests/**"
      - "main.py"
      - "pyproject.toml"
      - "DouKManager.spec"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: 自动测试
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: 构建便携版
        shell: pwsh
        run: pyinstaller --noconfirm --clean DouKManager.spec

      - name: 写入构建信息
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}".Substring(0, 7)
          $text = @(
            "DouK 全流程一体化管理器"
            "Version: 0.1.0"
            "Commit: $commit"
            "Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')"
          )
          Set-Content -LiteralPath "dist\DouK-Manager\BUILD-INFO.txt" -Value $text -Encoding UTF8

      - name: 压缩便携版
        shell: pwsh
        run: Compress-Archive -Path "dist\DouK-Manager\*" -DestinationPath "DouK-Manager_Windows_X64.zip" -Force

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: DouK-Manager_Windows_X64
          path: DouK-Manager_Windows_X64.zip
          if-no-files-found: error
          retention-days: 90

